<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #1591EA; } a:hover { color: #0B5E9E; }
    .room-name { font-size: 12px; font-weight: 600; fill: #2D2A26; }
    .room-count { font-size: 10px; fill: #6B6459; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; background: #FFFBF8; display: flex; flex-direction: column; overflow: hidden;">

  <!-- En-tete natif : 56dp, meme style que les ecrans (entities) -->
  <div style="height: 56px; background: #FFFBF8; border-bottom: 1px solid rgba(45,42,38,0.1); display: flex; align-items: center; padding: 0 8px; gap: 4px; flex-shrink: 0;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1591EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size: 20px; font-weight: 600; color: #2D2A26; flex-grow: 1;">Rez-de-chaussée</div>
  </div>

  <!-- Bascule de mode : le geste central de la refonte. Le plan s'ouvre en
       lecture, l'edition devient un choix explicite. Reprend le style des
       pastilles segmentees deja utilisees dans l'app. -->
  <div style="padding: 12px 16px 8px; display: flex; gap: 8px; flex-shrink: 0;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 2px solid #1591EA; background: #D8E8F3; padding: 9px 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B5E9E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="font-size: 14px; font-weight: 600; color: #0B5E9E;">Explorer</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 1px solid rgba(45,42,38,0.1); padding: 10px 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>
      <span style="font-size: 14px; color: #6B6459;">Modifier</span>
    </div>
  </div>

  <!-- Recherche : reprend la barre de l'accueil (halo teal, pastille ronde) -->
  <div style="padding: 4px 16px 12px; flex-shrink: 0;">
    <div style="border-radius: 9999px; background: rgba(46,196,182,0.15); padding: 3px;">
      <div style="display: flex; align-items: center; gap: 8px; border-radius: 9999px; background: #FFFFFF; padding: 10px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A39C8F" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span style="font-size: 15px; color: #A39C8F; flex-grow: 1;">Chercher un objet sur le plan</span>
      </div>
    </div>
  </div>

  <!-- LE PLAN. Sol clair pose sur un fond sable, murs epais a l'encre :
       c'est la structure qui porte le contraste, plus la couleur. -->
  <div style="flex-grow: 1; margin: 0 16px 16px; border-radius: 16px; background: #F5EEE6; position: relative; overflow: hidden;">
    <svg viewBox="0 0 343 520" style="width: 100%; height: 100%; display: block;">
      <defs>
        <filter id="floorShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2D2A26" flood-opacity="0.13"/>
        </filter>
      </defs>

      <!-- Sol : une seule dalle blanche sous toutes les pieces, legerement
           ombree. C'est ce qui fait lire "un logement" et non "des boites". -->
      <rect x="24" y="44" width="295" height="420" rx="4" fill="#FFFFFF" filter="url(#floorShadow)"/>

      <!-- Remplissages des pieces : la couleur devient une teinte, pas un aplat -->
      <g opacity="0.5">
        <rect x="24" y="44" width="172" height="262" fill="#C9E4C5"/>
        <rect x="24" y="306" width="172" height="158" fill="#E8D5C4"/>
        <rect x="196" y="44" width="123" height="156" fill="#FCE8A8"/>
        <rect x="196" y="200" width="123" height="146" fill="#F3C6D9"/>
        <rect x="196" y="346" width="123" height="118" fill="#BEE3DB"/>
      </g>

      <!-- Cloisons interieures : 3px -->
      <g stroke="#2D2A26" stroke-width="3" stroke-linecap="square">
        <line x1="196" y1="44" x2="196" y2="464"/>
        <line x1="24" y1="306" x2="196" y2="306"/>
        <line x1="196" y1="200" x2="319" y2="200"/>
        <line x1="196" y1="346" x2="319" y2="346"/>
      </g>

      <!-- Ouvertures : le mur s'interrompt, comme sur un vrai plan -->
      <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="butt">
        <line x1="196" y1="120" x2="196" y2="158"/>
        <line x1="196" y1="250" x2="196" y2="288"/>
        <line x1="196" y1="382" x2="196" y2="414"/>
        <line x1="86" y1="306" x2="126" y2="306"/>
      </g>

      <!-- Mur exterieur : 5px, plus epais que les cloisons -->
      <rect x="24" y="44" width="295" height="420" fill="none" stroke="#2D2A26" stroke-width="5"/>

      <!-- Porte d'entree : ouverture + arc de debattement -->
      <line x1="78" y1="464" x2="126" y2="464" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M78 464 A48 48 0 0 1 126 464" fill="none" stroke="#6B6459" stroke-width="1.2" stroke-dasharray="3 3"/>

      <!-- Etiquettes : nom + nombre d'objets. C'est ce qui manque le plus
           aujourd'hui — une piece ne dit rien de ce qu'elle contient. -->
      <text class="room-name" x="110" y="168" text-anchor="middle">Séjour</text>
      <text class="room-count" x="110" y="184" text-anchor="middle">38 objets</text>

      <text class="room-name" x="110" y="380" text-anchor="middle">Entrée</text>
      <text class="room-count" x="110" y="396" text-anchor="middle">9 objets</text>

      <text class="room-name" x="257" y="116" text-anchor="middle">Cuisine</text>
      <text class="room-count" x="257" y="132" text-anchor="middle">64 objets</text>

      <text class="room-name" x="257" y="266" text-anchor="middle">Chambre</text>
      <text class="room-count" x="257" y="282" text-anchor="middle">27 objets</text>

      <text class="room-name" x="257" y="398" text-anchor="middle">Salle de bain</text>
      <text class="room-count" x="257" y="414" text-anchor="middle">15 objets</text>

      <!-- Pastilles d'emplacement : petites, blanches, cerclees. Elles ne
           luttent plus avec le remplissage de la piece. -->
      <g>
        <circle cx="62" cy="96" r="13" fill="#FFFFFF" stroke="rgba(45,42,38,0.18)" stroke-width="1.5"/>
        <svg x="53" y="87" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16"/></svg>

        <circle cx="158" cy="240" r="13" fill="#FFFFFF" stroke="rgba(45,42,38,0.18)" stroke-width="1.5"/>
        <svg x="149" y="231" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="11" rx="1"/><path d="M3 12h18"/></svg>

        <circle cx="288" cy="92" r="13" fill="#FFFFFF" stroke="rgba(45,42,38,0.18)" stroke-width="1.5"/>
        <svg x="279" y="83" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><path d="M4 8h16v11H4z"/><path d="M4 8l2-4h12l2 4"/></svg>

        <circle cx="228" cy="304" r="13" fill="#FFFFFF" stroke="rgba(45,42,38,0.18)" stroke-width="1.5"/>
        <svg x="219" y="295" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 12h16"/><path d="M10 8.5h4"/></svg>

        <circle cx="288" cy="428" r="13" fill="#FFFFFF" stroke="rgba(45,42,38,0.18)" stroke-width="1.5"/>
        <svg x="279" y="419" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="16" rx="1"/><path d="M9 4v16"/></svg>
      </g>
    </svg>

    <!-- Recentrer : remplace le double-tap invisible d'aujourd'hui -->
    <div style="position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 9999px; background: #FFFFFF; border: 1px solid rgba(45,42,38,0.1); box-shadow: 0 2px 8px rgba(45,42,38,0.12); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
