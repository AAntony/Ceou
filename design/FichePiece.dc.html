<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #1591EA; } a:hover { color: #0B5E9E; }
    .room-name { font-size: 12px; font-weight: 600; fill: #2D2A26; }
    .room-count { font-size: 10px; fill: #6B6459; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; background: #FFFBF8; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="height: 56px; background: #FFFBF8; border-bottom: 1px solid rgba(45,42,38,0.1); display: flex; align-items: center; padding: 0 8px; gap: 4px; flex-shrink: 0;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1591EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size: 20px; font-weight: 600; color: #2D2A26; flex-grow: 1;">Rez-de-chaussée</div>
  </div>

  <!-- Le plan reste visible derriere la feuille : on garde le contexte
       spatial de la piece qu'on vient de toucher. -->
  <div style="flex-grow: 1; margin: 12px 16px 0; border-radius: 16px; background: #F5EEE6; overflow: hidden;">
    <svg viewBox="0 0 343 520" style="width: 100%; height: 100%; display: block;">
      <defs>
        <filter id="floorShadow2" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2D2A26" flood-opacity="0.13"/>
        </filter>
      </defs>
      <rect x="24" y="44" width="295" height="420" rx="4" fill="#FFFFFF" filter="url(#floorShadow2)"/>

      <g opacity="0.5">
        <rect x="24" y="44" width="172" height="262" fill="#C9E4C5"/>
        <rect x="24" y="306" width="172" height="158" fill="#E8D5C4"/>
        <rect x="196" y="200" width="123" height="146" fill="#F3C6D9"/>
        <rect x="196" y="346" width="123" height="118" fill="#BEE3DB"/>
      </g>
      <!-- La piece touchee garde sa pleine couleur -->
      <rect x="196" y="44" width="123" height="156" fill="#FCE8A8"/>

      <g stroke="#2D2A26" stroke-width="3" stroke-linecap="square">
        <line x1="196" y1="44" x2="196" y2="464"/>
        <line x1="24" y1="306" x2="196" y2="306"/>
        <line x1="196" y1="200" x2="319" y2="200"/>
        <line x1="196" y1="346" x2="319" y2="346"/>
      </g>
      <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="butt">
        <line x1="196" y1="120" x2="196" y2="158"/>
        <line x1="196" y1="250" x2="196" y2="288"/>
        <line x1="196" y1="382" x2="196" y2="414"/>
        <line x1="86" y1="306" x2="126" y2="306"/>
      </g>
      <rect x="24" y="44" width="295" height="420" fill="none" stroke="#2D2A26" stroke-width="5"/>

      <!-- Contour bleu : la piece selectionnee, dans la couleur d'action de l'app -->
      <rect x="196" y="44" width="123" height="156" fill="none" stroke="#1591EA" stroke-width="4"/>

      <text class="room-name" x="110" y="168" text-anchor="middle">Séjour</text>
      <text class="room-count" x="110" y="184" text-anchor="middle">38 objets</text>
      <text class="room-name" x="110" y="380" text-anchor="middle">Entrée</text>
      <text class="room-count" x="110" y="396" text-anchor="middle">9 objets</text>
      <text class="room-name" x="257" y="116" text-anchor="middle">Cuisine</text>
      <text class="room-count" x="257" y="132" text-anchor="middle">64 objets</text>
    </svg>
  </div>

  <!-- Feuille de bas d'ecran : meme squelette que BottomSheetModal
       (coins hauts arrondis, fond blanc, poignee) -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 24px rgba(45,42,38,0.16); padding: 10px 20px 28px;">
    <div style="width: 40px; height: 4px; border-radius: 9999px; background: rgba(45,42,38,0.15); margin: 0 auto 16px;"></div>

    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #FFF3DA; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E0A93C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v11H4z"/><path d="M4 8l2-4h12l2 4"/></svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 19px; font-weight: 700; color: #2D2A26;">Cuisine</div>
        <div style="font-size: 13px; color: #6B6459;">64 objets · 5 rangements</div>
      </div>
    </div>

    <div style="font-size: 12px; font-weight: 600; color: #6B6459; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;">Rangements</div>

    <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(45,42,38,0.07);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16"/></svg>
        <span style="flex-grow: 1; font-size: 15px; color: #2D2A26;">Placard du haut</span>
        <span style="font-size: 13px; color: #6B6459;">21</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A39C8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(45,42,38,0.07);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 12h16"/><path d="M10 8.5h4"/></svg>
        <span style="flex-grow: 1; font-size: 15px; color: #2D2A26;">Tiroir à couverts</span>
        <span style="font-size: 13px; color: #6B6459;">34</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A39C8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="11" rx="1"/><path d="M3 12h18"/></svg>
        <span style="flex-grow: 1; font-size: 15px; color: #2D2A26;">Étagère à épices</span>
        <span style="font-size: 13px; color: #6B6459;">9</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A39C8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1591EA; padding: 14px 0;">
      <span style="font-size: 16px; font-weight: 600; color: #FFFFFF;">Ouvrir la pièce</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
