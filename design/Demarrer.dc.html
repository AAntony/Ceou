<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #1591EA; } a:hover { color: #0B5E9E; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; background: #FFFBF8; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 56px; background: #FFFBF8; border-bottom: 1px solid rgba(45,42,38,0.1); display: flex; align-items: center; padding: 0 8px; gap: 4px; flex-shrink: 0;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1591EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size: 20px; font-weight: 600; color: #2D2A26; flex-grow: 1;">Nouveau plan</div>
  </div>

  <div style="padding: 24px 20px 8px;">
    <div style="font-size: 24px; font-weight: 700; color: #2D2A26; line-height: 30px;">Ton logement ressemble à&nbsp;?</div>
    <div style="font-size: 15px; color: #6B6459; margin-top: 8px; line-height: 21px;">Choisis le plus proche. Tu pourras tout déplacer, renommer et agrandir ensuite.</div>
  </div>

  <!-- Le moment le plus difficile d'un editeur de plan est la page blanche.
       On la remplace par quatre departs deja construits : on ne dessine
       plus, on ajuste. -->
  <div style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">

    <div style="border-radius: 16px; border: 2px solid #1591EA; background: #D8E8F3; padding: 12px;">
      <svg viewBox="0 0 120 84" style="width: 100%; display: block;">
        <rect x="6" y="6" width="108" height="72" fill="#FFFFFF" stroke="#2D2A26" stroke-width="3"/>
        <line x1="78" y1="6" x2="78" y2="78" stroke="#2D2A26" stroke-width="2"/>
        <rect x="6" y="6" width="72" height="72" fill="#C9E4C5" opacity="0.5"/>
        <rect x="78" y="6" width="36" height="72" fill="#BEE3DB" opacity="0.5"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #0B5E9E; margin-top: 10px;">Studio</div>
      <div style="font-size: 12px; color: #0B5E9E; opacity: 0.75;">2 espaces</div>
    </div>

    <div style="border-radius: 16px; border: 1px solid rgba(45,42,38,0.12); background: #FFFFFF; padding: 12px;">
      <svg viewBox="0 0 120 84" style="width: 100%; display: block;">
        <rect x="6" y="6" width="108" height="72" fill="#FFFFFF" stroke="#2D2A26" stroke-width="3"/>
        <line x1="70" y1="6" x2="70" y2="78" stroke="#2D2A26" stroke-width="2"/>
        <line x1="70" y1="46" x2="114" y2="46" stroke="#2D2A26" stroke-width="2"/>
        <rect x="6" y="6" width="64" height="72" fill="#C9E4C5" opacity="0.5"/>
        <rect x="70" y="6" width="44" height="40" fill="#F3C6D9" opacity="0.5"/>
        <rect x="70" y="46" width="44" height="32" fill="#FCE8A8" opacity="0.5"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2D2A26; margin-top: 10px;">2 pièces</div>
      <div style="font-size: 12px; color: #6B6459;">3 espaces</div>
    </div>

    <div style="border-radius: 16px; border: 1px solid rgba(45,42,38,0.12); background: #FFFFFF; padding: 12px;">
      <svg viewBox="0 0 120 84" style="width: 100%; display: block;">
        <rect x="6" y="6" width="108" height="72" fill="#FFFFFF" stroke="#2D2A26" stroke-width="3"/>
        <line x1="64" y1="6" x2="64" y2="78" stroke="#2D2A26" stroke-width="2"/>
        <line x1="64" y1="34" x2="114" y2="34" stroke="#2D2A26" stroke-width="2"/>
        <line x1="64" y1="58" x2="114" y2="58" stroke="#2D2A26" stroke-width="2"/>
        <line x1="6" y1="56" x2="64" y2="56" stroke="#2D2A26" stroke-width="2"/>
        <rect x="6" y="6" width="58" height="50" fill="#C9E4C5" opacity="0.5"/>
        <rect x="6" y="56" width="58" height="22" fill="#E8D5C4" opacity="0.5"/>
        <rect x="64" y="6" width="50" height="28" fill="#FCE8A8" opacity="0.5"/>
        <rect x="64" y="34" width="50" height="24" fill="#F3C6D9" opacity="0.5"/>
        <rect x="64" y="58" width="50" height="20" fill="#BEE3DB" opacity="0.5"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2D2A26; margin-top: 10px;">3 pièces</div>
      <div style="font-size: 12px; color: #6B6459;">5 espaces</div>
    </div>

    <div style="border-radius: 16px; border: 1px solid rgba(45,42,38,0.12); background: #FFFFFF; padding: 12px;">
      <svg viewBox="0 0 120 84" style="width: 100%; display: block;">
        <rect x="6" y="6" width="108" height="72" fill="#FFFFFF" stroke="#2D2A26" stroke-width="3"/>
        <line x1="6" y1="42" x2="114" y2="42" stroke="#2D2A26" stroke-width="2"/>
        <line x1="48" y1="6" x2="48" y2="42" stroke="#2D2A26" stroke-width="2"/>
        <line x1="82" y1="6" x2="82" y2="42" stroke="#2D2A26" stroke-width="2"/>
        <line x1="56" y1="42" x2="56" y2="78" stroke="#2D2A26" stroke-width="2"/>
        <rect x="6" y="6" width="42" height="36" fill="#C9E4C5" opacity="0.5"/>
        <rect x="48" y="6" width="34" height="36" fill="#FCE8A8" opacity="0.5"/>
        <rect x="82" y="6" width="32" height="36" fill="#E8D5C4" opacity="0.5"/>
        <rect x="6" y="42" width="50" height="36" fill="#F3C6D9" opacity="0.5"/>
        <rect x="56" y="42" width="58" height="36" fill="#D7C9F2" opacity="0.5"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2D2A26; margin-top: 10px;">Maison</div>
      <div style="font-size: 12px; color: #6B6459;">5 espaces</div>
    </div>

  </div>

  <div style="padding: 16px 20px 0;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1px solid rgba(45,42,38,0.12); padding: 14px 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size: 15px; color: #6B6459;">Partir d'une feuille vide</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 28px;">
    <div style="display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #1591EA; padding: 15px 0;">
      <span style="font-size: 16px; font-weight: 600; color: #FFFFFF;">Utiliser ce départ</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
