<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #1591EA; } a:hover { color: #0B5E9E; }
    .room-name { font-size: 12px; font-weight: 600; fill: #2D2A26; }
    .room-count { font-size: 10px; fill: #6B6459; }
    .room-name-off { font-size: 12px; font-weight: 600; fill: #A39C8F; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; background: #FFFBF8; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 56px; background: #FFFBF8; border-bottom: 1px solid rgba(45,42,38,0.1); display: flex; align-items: center; padding: 0 8px; gap: 4px; flex-shrink: 0;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1591EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size: 20px; font-weight: 600; color: #2D2A26; flex-grow: 1;">Rez-de-chaussée</div>
  </div>

  <div style="padding: 12px 16px 8px; display: flex; gap: 8px; flex-shrink: 0;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 2px solid #1591EA; background: #D8E8F3; padding: 9px 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B5E9E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="font-size: 14px; font-weight: 600; color: #0B5E9E;">Explorer</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 1px solid rgba(45,42,38,0.1); padding: 10px 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>
      <span style="font-size: 14px; color: #6B6459;">Modifier</span>
    </div>
  </div>

  <div style="padding: 4px 16px 12px; flex-shrink: 0;">
    <div style="border-radius: 9999px; background: rgba(46,196,182,0.15); padding: 3px;">
      <div style="display: flex; align-items: center; gap: 8px; border-radius: 9999px; background: #FFFFFF; padding: 10px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1591EA" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span style="font-size: 15px; color: #2D2A26; flex-grow: 1;">clavier</span>
        <div style="width: 22px; height: 22px; border-radius: 9999px; background: rgba(45,42,38,0.1); display: flex; align-items: center; justify-content: center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; margin: 0 16px 16px; border-radius: 16px; background: #F5EEE6; position: relative; overflow: hidden;">
    <svg viewBox="0 0 343 520" style="width: 100%; height: 100%; display: block;">
      <defs>
        <filter id="floorShadow3" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2D2A26" flood-opacity="0.13"/>
        </filter>
        <filter id="pinShadow" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B5E9E" flood-opacity="0.4"/>
        </filter>
      </defs>
      <rect x="24" y="44" width="295" height="420" rx="4" fill="#FFFFFF" filter="url(#floorShadow3)"/>

      <!-- Les pieces sans resultat s'effacent : c'est le contraste qui
           designe la reponse. -->
      <g opacity="0.16">
        <rect x="24" y="306" width="172" height="158" fill="#E8D5C4"/>
        <rect x="196" y="44" width="123" height="156" fill="#FCE8A8"/>
        <rect x="196" y="200" width="123" height="146" fill="#F3C6D9"/>
        <rect x="196" y="346" width="123" height="118" fill="#BEE3DB"/>
      </g>
      <rect x="24" y="44" width="172" height="262" fill="#C9E4C5" opacity="0.7"/>

      <g stroke="#2D2A26" stroke-width="3" stroke-linecap="square" opacity="0.3">
        <line x1="196" y1="44" x2="196" y2="464"/>
        <line x1="24" y1="306" x2="196" y2="306"/>
        <line x1="196" y1="200" x2="319" y2="200"/>
        <line x1="196" y1="346" x2="319" y2="346"/>
      </g>
      <rect x="24" y="44" width="295" height="420" fill="none" stroke="#2D2A26" stroke-width="5" opacity="0.3"/>

      <rect x="24" y="44" width="172" height="262" fill="none" stroke="#2D2A26" stroke-width="4"/>

      <text class="room-name" x="110" y="132" text-anchor="middle">Séjour</text>
      <text class="room-count" x="110" y="148" text-anchor="middle">38 objets</text>

      <text class="room-name-off" x="110" y="388" text-anchor="middle">Entrée</text>
      <text class="room-name-off" x="257" y="126" text-anchor="middle">Cuisine</text>
      <text class="room-name-off" x="257" y="276" text-anchor="middle">Chambre</text>
      <text class="room-name-off" x="257" y="408" text-anchor="middle">Salle de bain</text>

      <!-- LE MARQUEUR. Reprend exactement le pin du logo Ceou (le "o" de
           Ceou, deja l'icone de l'onglet Accueil) plutot qu'une petite
           fleche rouge de 16px sans rapport avec l'identite de l'app.
           Halo au sol + ombre portee : la pointe designe un point precis,
           et le marqueur se voit d'un coup d'oeil sur n'importe quelle
           couleur de piece. -->
      <ellipse cx="158" cy="252" rx="34" ry="10" fill="#1591EA" opacity="0.10"/>
      <ellipse cx="158" cy="252" rx="17" ry="5" fill="#1591EA" opacity="0.22"/>
      <g transform="translate(158,252) scale(1.05) translate(-32,-58)" filter="url(#pinShadow)">
        <path d="M32 6c-9.4 0-17 7.6-17 17 0 12.8 17 35 17 35s17-22.2 17-35c0-9.4-7.6-17-17-17z" fill="#1591EA"/>
        <circle cx="32" cy="22" r="7.5" fill="#FFFFFF"/>
      </g>
    </svg>

    <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; background: #FFFFFF; border-radius: 16px; border: 1px solid rgba(45,42,38,0.1); box-shadow: 0 4px 16px rgba(45,42,38,0.14); padding: 14px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #D8E8F3; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1591EA" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="11" rx="1"/><path d="M3 12h18"/></svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 600; color: #2D2A26;">Clavier externe</div>
        <div style="font-size: 13px; color: #6B6459;">Séjour · Étagère du bureau</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A39C8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
